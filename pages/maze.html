<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maze</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;border:1px solid #1a1a1a;border-radius:4px}
#hud{color:#555;font-size:12px;margin-top:10px;display:flex;gap:24px;align-items:center;font-family:monospace}
#hud .val{color:#ccc}
#msg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;gap:16px}
#msg h2{font-size:28px;font-weight:300;letter-spacing:2px}
#msg p{color:#666;font-size:14px;font-family:monospace;text-align:center;max-width:320px;line-height:1.6}
#msg button{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:10px 28px;border-radius:4px;cursor:pointer;font-size:14px;letter-spacing:1px}
#msg button:hover{background:#252525;border-color:#555;color:#fff}
#perm{position:fixed;top:10px;right:10px;z-index:5}
#perm button{background:#111;border:1px solid #222;color:#555;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-family:monospace}
#perm button:hover{border-color:#444;color:#888}
#calib{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#444;font-size:11px;font-family:monospace;z-index:4}
</style>
</head>
<body>
<div id="perm"><button id="btnPerm" onclick="enableMotion()">Enable Motion</button></div>
<canvas id="c"></canvas>
<div id="hud">
  <div>TILT <span class="val" id="tilt">0.00 , 0.00</span></div>
  <div>TIME <span class="val" id="time">0.0s</span></div>
  <div>BEST <span class="val" id="best">--</span></div>
</div>
<div id="calib">Tilt your phone to test</div>
<div id="msg">
  <h2 id="msgTitle">MAZE</h2>
  <p id="msgSub">Tilt your device to roll the red dot to the green goal</p>
  <button id="msgBtn" onclick="startGame()">START</button>
</div>
<script>
const CV=document.getElementById('c');
const ctx=CV.getContext('2d');
const $=id=>document.getElementById(id);

// ---- MAZE ----
const COLS=21,ROWS=21;
let maze,cellSize,offX,offY;
let px,py,pvx,pvy;
let goalX,goalY;
let state='idle';
let startTime,elapsed=0;
let bestTime=localStorage.getItem('mazeBest')||null;
let trail=[];
let raf;

// ---- ORIENTATION ----
// We always listen. The question is whether we USE the data.
let orientOK=false;
let rawBeta=0, rawGamma=0;   // raw degrees from device
let calBeta=0, calGamma=0;   // calibration offset
let calibrated=false;
let gx=0, gy=0;              // normalized -1..1 gravity

if(bestTime) $('best').textContent=parseFloat(bestTime).toFixed(1)+'s';

// Register orientation listener IMMEDIATELY on page load
window.addEventListener('deviceorientation', function(e){
  orientOK=true;
  rawBeta  = e.beta  || 0;   // -180..180  (front-back tilt)
  rawGamma = e.gamma || 0;   // -90..90    (left-right tilt);
  $('btnPerm').style.display='none';
});

function enableMotion(){
  // iOS 13+ requires explicit permission request
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(r=>{
      if(r==='granted'){
        window.addEventListener('deviceorientation', function(e){
          orientOK=true;
          rawBeta=e.beta||0;
          rawGamma=e.gamma||0;
          $('btnPerm').style.display='none';
        });
      }
    });
  }
}

// ---- MAZE GENERATION ----
function buildMaze(){
  let g=[];
  for(let r=0;r<ROWS;r++){g[r]=[];for(let c=0;c<COLS;c++)g[r][c]=0;}
  function carve(r,c){
    g[r][c]=1;
    let d=[[0,-2],[0,2],[-2,0],[2,0]];
    for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
    for(let[dr,dc]of d){
      let nr=r+dr,nc=c+dc;
      if(nr>0&&nr<ROWS-1&&nc>0&&nc<COLS-1&&g[nr][nc]===0){
        g[r+dr/2][c+dc/2]=1;
        carve(nr,nc);
      }
    }
  }
  carve(1,1);
  g[1][1]=2;
  // BFS for farthest cell
  let dist={},q=[[1,1]];dist['1,1']=0;
  let maxD=0,gr=ROWS-2,gc=COLS-2;
  while(q.length){
    let[r,c]=q.shift();
    for(let[dr,dc]of[[0,1],[0,-1],[1,0],[-1,0]]){
      let nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&g[nr][nc]!==0&&!(nr+','+nc in dist)){
        dist[nr+','+nc]=dist[r+','+c]+1;
        q.push([nr,nc]);
        if(dist[nr+','+nc]>maxD&&(nr>3||nc>3)){maxD=dist[nr+','+nc];gr=nr;gc=nc;}
      }
    }
  }
  g[gr][gc]=3;
  return {grid:g,goalR:gr,goalC:gc};
}

function resize(){
  let maxW=Math.min(window.innerWidth-16,500);
  let maxH=Math.min(window.innerHeight-120,500);
  cellSize=Math.floor(Math.min(maxW/COLS,maxH/ROWS));
  CV.width=cellSize*COLS;
  CV.height=cellSize*ROWS;
}

function initGame(){
  resize();
  let r=buildMaze();
  maze=r.grid;goalX=r.goalC;goalY=r.goalR;
  px=1.5;py=1.5;pvx=0;pvy=0;
  trail=[];
  // Calibrate: current position = "neutral"
  calBeta=rawBeta;calGamma=rawGamma;
  calibrated=true;
  startTime=performance.now();elapsed=0;
  state='playing';
}

function startGame(){
  $('msg').style.display='none';
  initGame();
  if(raf)cancelAnimationFrame(raf);
  loop();
}

// ---- PHYSICS ----
const ACC=0.015;
const FRICTION=0.90;
const MAX_SPD=0.14;
const RAD=0.30;

function wall(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS)return true;
  return maze[Math.floor(r)][Math.floor(c)]===0;
}

function update(){
  if(state!=='playing')return;

  // Compute gravity from orientation
  if(orientOK&&calibrated){
    let dGamma=rawGamma-calGamma;
    let dBeta=rawBeta-calBeta;
    gx=Math.max(-1,Math.min(1,dGamma/30));
    gy=Math.max(-1,Math.min(1,dBeta/30));
  }

  pvx+=gx*ACC;
  pvy+=gy*ACC;
  pvx*=FRICTION;
  pvy*=FRICTION;
  pvx=Math.max(-MAX_SPD,Math.min(MAX_SPD,pvx));
  pvy=Math.max(-MAX_SPD,Math.min(MAX_SPD,pvy));

  let nx=px+pvx, ny=py+pvy;
  // X collision
  if(!wall(py-RAD,nx+RAD)&&!wall(py+RAD,nx+RAD)&&!wall(py-RAD,nx-RAD)&&!wall(py+RAD,nx-RAD)){
    px=nx;
  }else{
    pvx=-pvx*0.2;
    let mc=Math.round(nx);
    if(wall(Math.round(py),mc))px=mc+(nx<mc?(1-RAD):RAD);
  }
  // Y collision
  if(!wall(ny-RAD,px+RAD)&&!wall(ny+RAD,px+RAD)&&!wall(ny-RAD,px-RAD)&&!wall(ny+RAD,px-RAD)){
    py=ny;
  }else{
    pvy=-pvy*0.2;
    let mr=Math.round(ny);
    if(wall(mr,Math.round(px)))py=mr+(ny<mr?(1-RAD):RAD);
  }
  px=Math.max(RAD,Math.min(COLS-1-RAD,px));
  py=Math.max(RAD,Math.min(ROWS-1-RAD,py));

  if(Math.abs(pvx)>0.003||Math.abs(pvy)>0.003){
    trail.push({x:px,y:py});
    if(trail.length>150)trail.shift();
  }

  // Win
  if(Math.hypot(px-goalX-0.5,py-goalY-0.5)<0.5){
    state='won';
    elapsed=(performance.now()-startTime)/1000;
    if(!bestTime||elapsed<parseFloat(bestTime)){
      bestTime=elapsed.toFixed(2);
      localStorage.setItem('mazeBest',bestTime);
      $('best').textContent=parseFloat(bestTime).toFixed(1)+'s';
    }
    $('msgTitle').textContent='COMPLETE';
    $('msgSub').textContent='Time: '+elapsed.toFixed(2)+'s'+(bestTime?' | Best: '+parseFloat(bestTime).toFixed(2)+'s':'');
    $('msgBtn').textContent='RESTART';
    $('msg').style.display='flex';
  }

  $('tilt').textContent=gx.toFixed(2)+' , '+gy.toFixed(2);
  elapsed=(performance.now()-startTime)/1000;
  $('time').textContent=elapsed.toFixed(1)+'s';
}

function draw(){
  ctx.fillStyle='#0a0a0a';
  ctx.fillRect(0,0,CV.width,CV.height);
  // Walls
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(maze[r][c]===0){
        ctx.fillStyle='#1a1a1a';
        ctx.fillRect(c*cellSize,r*cellSize,cellSize,cellSize);
        ctx.fillStyle='#222';
        ctx.fillRect(c*cellSize+1,r*cellSize+1,cellSize-2,1);
        ctx.fillRect(c*cellSize+1,r*cellSize+1,1,cellSize-2);
        ctx.fillStyle='#111';
        ctx.fillRect(c*cellSize+1,r*cellSize+cellSize-2,cellSize-2,1);
        ctx.fillRect(c*cellSize+cellSize-2,r*cellSize+1,1,cellSize-2);
      }
    }
  }
  // Goal
  let t=performance.now()/1000;
  let pulse=0.7+0.3*Math.sin(t*3);
  ctx.beginPath();
  ctx.arc((goalX+0.5)*cellSize,(goalY+0.5)*cellSize,cellSize*0.4*pulse,0,Math.PI*2);
  ctx.fillStyle='#22c55e';ctx.fill();
  ctx.beginPath();
  ctx.arc((goalX+0.5)*cellSize,(goalY+0.5)*cellSize,cellSize*0.18,0,Math.PI*2);
  ctx.fillStyle='#4ade80';ctx.fill();
  // Trail
  for(let i=0;i<trail.length;i++){
    let a=i/trail.length;
    ctx.beginPath();
    ctx.arc(trail[i].x*cellSize,trail[i].y*cellSize,cellSize*0.06*a,0,Math.PI*2);
    ctx.fillStyle='rgba(239,68,68,'+(a*0.4)+')';
    ctx.fill();
  }
  // Player
  let bx=px*cellSize,by=py*cellSize,br=RAD*cellSize;
  ctx.beginPath();
  ctx.arc(bx,by,br*2.5,0,Math.PI*2);
  let g2=ctx.createRadialGradient(bx,by,0,bx,by,br*2.5);
  g2.addColorStop(0,'rgba(239,68,68,0.3)');
  g2.addColorStop(1,'rgba(239,68,68,0)');
  ctx.fillStyle=g2;ctx.fill();
  ctx.beginPath();
  ctx.arc(bx,by,br,0,Math.PI*2);
  let bg=ctx.createRadialGradient(bx-br*0.3,by-br*0.3,0,bx,by,br);
  bg.addColorStop(0,'#f87171');
  bg.addColorStop(1,'#dc2626');
  ctx.fillStyle=bg;ctx.fill();
}

function loop(){
  update();draw();
  raf=requestAnimationFrame(loop);
}

// ---- TOUCH / MOUSE FALLBACK ----
let pointerDown=false;
CV.addEventListener('mousedown',()=>{pointerDown=true;});
CV.addEventListener('mouseup',()=>{pointerDown=false;});
CV.addEventListener('mouseleave',()=>{pointerDown=false;});
CV.addEventListener('mousemove',e=>{
  if(!pointerDown||state!=='playing')return;
  let rect=CV.getBoundingClientRect();
  let mx=(e.clientX-rect.left)/cellSize;
  let my=(e.clientY-rect.top)/cellSize;
  gx=Math.max(-1,Math.min(1,(mx-px)*1.0));
  gy=Math.max(-1,Math.min(1,(my-py)*1.0));
});
CV.addEventListener('touchstart',e=>{e.preventDefault();pointerDown=true;},{passive:false});
CV.addEventListener('touchend',e=>{e.preventDefault();pointerDown=false;},{passive:false});
CV.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(state!=='playing')return;
  let rect=CV.getBoundingClientRect();
  let t=e.touches[0];
  let mx=(t.clientX-rect.left)/cellSize;
  let my=(t.clientY-rect.top)/cellSize;
  gx=Math.max(-1,Math.min(1,(mx-px)*1.0));
  gy=Math.max(-1,Math.min(1,(my-py)*1.0));
},{passive:false});

// ---- INIT ----
resize();
window.addEventListener('resize',()=>{if(maze)resize();});
</script>
</body>
</html>
