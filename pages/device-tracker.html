<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: #808080; margin-bottom: 25px; font-size: 0.95rem; }

        .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 25px; flex-wrap: wrap; }
        .refresh-btn {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #1a1a2e;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.15s;
        }
        .refresh-btn:hover { transform: scale(1.04); }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .last-updated { color: #606060; font-size: 0.8rem; }
        .scanning { color: #00d4ff; font-size: 0.85rem; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .status-bar { display: flex; gap: 16px; margin-bottom: 25px; flex-wrap: wrap; }
        .status-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 8px;
            padding: 14px 20px;
            flex: 1;
            min-width: 150px;
        }
        .status-item .label { font-size: 0.7rem; color: #606060; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-item .value { font-size: 1.5rem; color: #00d4ff; font-weight: 700; margin-top: 2px; }
        .status-item .value.online { color: #00ff88; }
        .status-item .value.offline { color: #ff4444; }
        .status-item .value.unknown { color: #ffaa00; }

        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

        .panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 10px;
            padding: 20px;
        }
        .panel h2 { font-size: 1rem; color: #00d4ff; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }

        .device-list { display: flex; flex-direction: column; gap: 10px; }
        .device-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0,212,255,0.12);
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }
        .device-card:hover { border-color: rgba(0,212,255,0.4); }
        .device-info { flex: 1; }
        .device-info h3 { color: #e0e0e0; font-size: 0.95rem; margin-bottom: 3px; }
        .device-info p { color: #707070; font-size: 0.78rem; }
        .device-meta { display: flex; gap: 8px; align-items: center; }
        .device-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .device-status.online { background: rgba(0,255,136,0.12); color: #00ff88; border: 1px solid rgba(0,255,136,0.25); }
        .device-status.offline { background: rgba(255,68,68,0.12); color: #ff4444; border: 1px solid rgba(255,68,68,0.25); }
        .device-status.unknown { background: rgba(255,170,0,0.12); color: #ffaa00; border: 1px solid rgba(255,170,0,0.25); }
        .device-type-icon { font-size: 1.2rem; margin-right: 8px; }

        .log-list { display: flex; flex-direction: column; gap: 6px; max-height: 400px; overflow-y: auto; }
        .log-list::-webkit-scrollbar { width: 4px; }
        .log-list::-webkit-scrollbar-track { background: transparent; }
        .log-list::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 2px; }
        .log-entry {
            display: flex;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.02);
            border-left: 2px solid transparent;
        }
        .log-entry.info { border-left-color: #00d4ff; }
        .log-entry.success { border-left-color: #00ff88; }
        .log-entry.warn { border-left-color: #ffaa00; }
        .log-entry.error { border-left-color: #ff4444; }
        .log-time { color: #505050; font-family: monospace; white-space: nowrap; }
        .log-msg { color: #b0b0b0; }
        .log-msg strong { color: #e0e0e0; }

        .empty-state { color: #505050; font-size: 0.85rem; text-align: center; padding: 30px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Device Tracker</h1>
        <p class="subtitle">Network device discovery and activity monitoring</p>

        <div class="controls">
            <button class="refresh-btn" id="refreshBtn" onclick="scanDevices()">Scan Network</button>
            <span class="last-updated" id="lastUpdated">Last scan: --</span>
            <span class="scanning" id="scanningIndicator" style="display:none">Scanning...</span>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="label">Total Devices</div>
                <div class="value" id="totalDevices">0</div>
            </div>
            <div class="status-item">
                <div class="label">Online</div>
                <div class="value online" id="onlineCount">0</div>
            </div>
            <div class="status-item">
                <div class="label">Offline</div>
                <div class="value offline" id="offlineCount">0</div>
            </div>
            <div class="status-item">
                <div class="label">Unknown</div>
                <div class="value unknown" id="unknownCount">0</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <h2>Devices</h2>
                <div class="device-list" id="deviceList">
                    <p class="empty-state">Click Scan to discover devices</p>
                </div>
            </div>

            <div class="panel">
                <h2>Activity Log</h2>
                <div class="log-list" id="logList">
                    <p class="empty-state">No activity yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const logs = [];
        const devices = new Map();

        function addLog(msg, type = 'info') {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour12: false });
            logs.unshift({ time, msg, type });
            if (logs.length > 50) logs.pop();
            renderLogs();
        }

        function renderLogs() {
            const list = document.getElementById('logList');
            if (logs.length === 0) {
                list.innerHTML = '<p class="empty-state">No activity yet</p>';
                return;
            }
            list.innerHTML = logs.map(l => `
                <div class="log-entry ${l.type}">
                    <span class="log-time">${l.time}</span>
                    <span class="log-msg">${l.msg}</span>
                </div>
            `).join('');
        }

        function getLocalIPs() {
            return new Promise((resolve) => {
                const ips = [];
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer().then(o => pc.setLocalDescription(o));
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) {
                        pc.close();
                        resolve(ips);
                        return;
                    }
                    const ipMatch = /([0-9]{1,3}\.){3}[0-9]{1,3}/.exec(ice.candidate.candidate);
                    if (ipMatch && !ips.includes(ipMatch[0])) {
                        ips.push(ipMatch[0]);
                    }
                };
                setTimeout(() => { pc.close(); resolve(ips); }, 2000);
            });
        }

        async function scanDevices() {
            const btn = document.getElementById('refreshBtn');
            const indicator = document.getElementById('scanningIndicator');
            btn.disabled = true;
            indicator.style.display = 'inline';

            addLog('Starting network scan...', 'info');
            const scanStart = Date.now();

            // Detect this device
            const thisDevice = {
                name: 'This Device',
                type: 'browser',
                typeLabel: 'Browser',
                icon: '🌐',
                ip: '127.0.0.1',
                status: 'online',
                details: getBrowserInfo(),
                lastSeen: new Date()
            };
            devices.set('this', thisDevice);
            addLog(`Detected <strong>This Device</strong> — ${thisDevice.details}`, 'success');

            // Get local IPs via WebRTC
            try {
                const ips = await getLocalIPs();
                if (ips.length > 0) {
                    addLog(`Local IPs discovered: <strong>${ips.join(', ')}</strong>`, 'info');
                    thisDevice.ip = ips[0];
                } else {
                    addLog('No local IPs detected via WebRTC', 'warn');
                }
            } catch (e) {
                addLog('WebRTC IP detection failed', 'warn');
            }

            // Check MuMuPlayer emulator (common ADB port)
            const emuDevice = {
                name: 'MuMuPlayer',
                type: 'emulator',
                typeLabel: 'Android Emulator',
                icon: '📱',
                ip: '127.0.0.1:5555',
                status: 'unknown',
                details: 'ADB port 5555',
                lastSeen: null
            };
            devices.set('mumu', emuDevice);
            addLog('Checking <strong>MuMuPlayer</strong> emulator (ADB 5555)...', 'info');

            // Try to detect ADB via fetch to localhost (won't work from browser but logs the attempt)
            try {
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 1500);
                await fetch('http://127.0.0.1:5037/server', { signal: controller.signal, mode: 'no-cors' });
                emuDevice.status = 'online';
                emuDevice.lastSeen = new Date();
                addLog('<strong>MuMuPlayer</strong> responded — status online', 'success');
            } catch (e) {
                emuDevice.status = 'unknown';
                addLog('<strong>MuMuPlayer</strong> not reachable from browser (expected — use ADB directly)', 'warn');
            }

            // Network info
            if (navigator.connection) {
                const conn = navigator.connection;
                addLog(`Network: <strong>${conn.effectiveType || 'unknown'}</strong> — downlink ${conn.downlink || '?'} Mbps`, 'info');
            }

            // Platform info
            addLog(`Platform: <strong>${navigator.platform}</strong> — ${navigator.hardwareConcurrency || '?'} cores`, 'info');

            const elapsed = ((Date.now() - scanStart) / 1000).toFixed(1);
            addLog(`Scan complete in <strong>${elapsed}s</strong> — ${devices.size} device(s) found`, 'success');

            document.getElementById('lastUpdated').textContent = 'Last scan: ' + new Date().toLocaleTimeString();

            renderDevices();
            btn.disabled = false;
            indicator.style.display = 'none';
        }

        function getBrowserInfo() {
            const ua = navigator.userAgent;
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Edg')) return 'Edge';
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Safari')) return 'Safari';
            if (ua.includes('Brave')) return 'Brave';
            return 'Unknown Browser';
        }

        function renderDevices() {
            const list = document.getElementById('deviceList');
            const allDevices = Array.from(devices.values());

            const total = allDevices.length;
            const online = allDevices.filter(d => d.status === 'online').length;
            const offline = allDevices.filter(d => d.status === 'offline').length;
            const unknown = allDevices.filter(d => d.status === 'unknown').length;

            document.getElementById('totalDevices').textContent = total;
            document.getElementById('onlineCount').textContent = online;
            document.getElementById('offlineCount').textContent = offline;
            document.getElementById('unknownCount').textContent = unknown;

            if (allDevices.length === 0) {
                list.innerHTML = '<p class="empty-state">No devices found</p>';
                return;
            }

            list.innerHTML = allDevices.map(d => `
                <div class="device-card">
                    <div class="device-info">
                        <h3><span class="device-type-icon">${d.icon}</span>${d.name}</h3>
                        <p>${d.typeLabel} — ${d.ip} — ${d.details}</p>
                    </div>
                    <div class="device-meta">
                        <span class="device-status ${d.status}">${d.status}</span>
                    </div>
                </div>
            `).join('');
        }

        // Auto-scan on load
        window.addEventListener('load', () => {
            addLog('Device Tracker initialized', 'info');
            scanDevices();
        });
    </script>
</body>
</html>
