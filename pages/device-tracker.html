<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #b0b0b0; margin-bottom: 30px; }
        .status-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .status-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 8px;
            padding: 15px 20px;
            flex: 1;
            min-width: 180px;
        }
        .status-item .label { font-size: 0.8rem; color: #808080; text-transform: uppercase; }
        .status-item .value { font-size: 1.3rem; color: #00d4ff; font-weight: bold; margin-top: 4px; }
        .status-item .value.online { color: #00ff88; }
        .status-item .value.offline { color: #ff4444; }
        .device-list { margin-top: 20px; }
        .device-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .device-info h3 { color: #00d4ff; margin-bottom: 5px; }
        .device-info p { color: #b0b0b0; font-size: 0.9rem; }
        .device-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .device-status.online { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .device-status.offline { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        .refresh-btn {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #1a1a2e;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .refresh-btn:hover { transform: scale(1.05); }
        .last-updated { color: #808080; font-size: 0.85rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Device Tracker</h1>
        <p class="subtitle">Monitor connected devices and their status</p>

        <button class="refresh-btn" onclick="refreshDevices()">Refresh</button>
        <p class="last-updated" id="lastUpdated">Last updated: --</p>

        <div class="status-bar">
            <div class="status-item">
                <div class="label">Total Devices</div>
                <div class="value" id="totalDevices">--</div>
            </div>
            <div class="status-item">
                <div class="label">Online</div>
                <div class="value online" id="onlineCount">--</div>
            </div>
            <div class="status-item">
                <div class="label">Offline</div>
                <div class="value offline" id="offlineCount">--</div>
            </div>
        </div>

        <div class="device-list" id="deviceList">
            <p style="color:#808080">Click Refresh to scan for devices...</p>
        </div>
    </div>

    <script>
        function refreshDevices() {
            document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();

            // Try to get device info from browser APIs
            const devices = [];

            // Check if we can detect any local network devices via WebRTC
            if (window.RTCPeerConnection) {
                devices.push({
                    name: 'This Device',
                    type: 'Browser',
                    ip: 'Local',
                    status: 'online',
                    details: navigator.userAgent.split(' ').slice(-2).join(' ')
                });
            }

            // Add placeholder for ADB devices (would need backend)
            devices.push({
                name: 'MuMuPlayer (Emulator)',
                type: 'Android Emulator',
                ip: '127.0.0.1:5555',
                status: 'unknown',
                details: 'ADB connection required'
            });

            renderDevices(devices);
        }

        function renderDevices(devices) {
            const list = document.getElementById('deviceList');
            const total = devices.length;
            const online = devices.filter(d => d.status === 'online').length;
            const offline = devices.filter(d => d.status === 'offline').length;

            document.getElementById('totalDevices').textContent = total;
            document.getElementById('onlineCount').textContent = online;
            document.getElementById('offlineCount').textContent = offline;

            if (devices.length === 0) {
                list.innerHTML = '<p style="color:#808080">No devices found.</p>';
                return;
            }

            list.innerHTML = devices.map(d => `
                <div class="device-card">
                    <div class="device-info">
                        <h3>${d.name}</h3>
                        <p>${d.type} — ${d.ip} — ${d.details}</p>
                    </div>
                    <span class="device-status ${d.status}">${d.status}</span>
                </div>
            `).join('');
        }

        // Auto-refresh on load
        refreshDevices();
    </script>
</body>
</html>
